# Server Configuration
server.port=${PORT:8080}
spring.application.name=financial-health-dashboard

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moneymaking}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hasanali7623}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:yourSuperSecretJWTKeyThatIsAtLeast256BitsLongForHS256Algorithm}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# External APIs
ocr.space.api.key=${OCR_SPACE_API_KEY:your_ocr_space_api_key}

gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key}

frankfurter.base.url=${FRANKFURTER_BASE_URL:https://api.frankfurter.dev/v1}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://financial-hub-6a2o.onrender.com,http://localhost:3000,http://localhost:5173}

# Mail
mailgun.api.key=${MAILGUN_API_KEY:optional}
mailgun.domain=${MAILGUN_DOMAIN:optional}

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.finance=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true